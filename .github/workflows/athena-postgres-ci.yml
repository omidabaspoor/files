name: Athena PostgreSQL Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "workspace-01a0078c-b64b-74c7-acb6-50546f38c794.zip"
      - ".github/workflows/athena-postgres-ci.yml"

jobs:
  postgres-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: athena_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athena_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      ATHENA_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/athena_test

    steps:
      - name: Checkout files repository
        uses: actions/checkout@v4

      - name: Verify ZIP and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="workspace-01a0078c-b64b-74c7-acb6-50546f38c794.zip"
          EXPECTED_SHA256="397dd0d059775f2c3283b83e00b85ddf8fca45ebb6ea651ae238902f41aaeabd"
          test -f "$ZIP"
          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --strict
          unzip -q "$ZIP" -d /tmp/athena-workspace
          PROJECT="/tmp/athena-workspace/vmania-athena-runtime-poc-01b2"
          test -f "$PROJECT/pyproject.toml"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate ephemeral runtime database credential
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          from urllib.parse import quote

          password = secrets.token_urlsafe(24)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"ATHENA_RUNTIME_DB_PASSWORD={password}\n")
              output.write(
                  "ATHENA_TEST_DATABASE_URL="
                  f"postgresql+asyncpg://athena_runtime_login:{quote(password)}"
                  "@localhost:5432/athena_test\n"
              )
          PY

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install project
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pip install -e '.[dev]'

      - name: Bootstrap non-superuser runtime roles
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          psql postgresql://postgres@localhost:5432/athena_test \
            -f scripts/bootstrap_test_roles.sql

      - name: Unit and security tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q -m "not integration"

      - name: Migration up
        working-directory: ${{ env.PROJECT_DIR }}
        run: alembic upgrade head

      - name: PostgreSQL integration tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q -m integration

      - name: Migration down and up
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Wheel build and isolated import
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python -m build --wheel
          python -m venv /tmp/athena-wheel-venv
          /tmp/athena-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/athena-wheel-venv/bin/python -c \
            'import athena_runtime; import athena_runtime.persistence.schema'

      - name: Lint and compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ruff check .
          python -m compileall -q src tests alembic

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athena-postgres-failure-py${{ matrix.python-version }}
          path: |
            ${{ env.PROJECT_DIR }}/docs/poc/
            ${{ env.PROJECT_DIR }}/alembic/
            ${{ env.PROJECT_DIR }}/tests/integration/
          if-no-files-found: ignore
